services:
    zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
        networks: [chat-net]
        restart: unless-stopped
        healthcheck:
            test: nc -z localhost 2181 || exit -1
            interval: 10s
            timeout: 5s
            retries: 3

    kafka:
        image: confluentinc/cp-kafka:7.5.0
        depends_on:
            zookeeper:
                condition: service_healthy
        ports:
            - '127.0.0.1:19092:19092'
        networks: [chat-net]
        restart: unless-stopped
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

            KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            # helpful for single-node + transactions
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1',
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 60s

    redis:
        image: redis:7.2-alpine
        ports:
            - '127.0.0.1:6379:6379'
        networks: [chat-net]
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
            interval: 5s
            timeout: 3s
            retries: 20

    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        ports:
            - '127.0.0.1:9000:9000' # S3 API
            - '127.0.0.1:9001:9001' # Web UI
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER?required}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD?required}
        volumes:
            - minio-data:/data
        networks: [chat-net]
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD',
                    'curl',
                    '-f',
                    'http://localhost:9000/minio/health/ready',
                ]
            interval: 5s
            timeout: 3s
            retries: 20

    minio-init:
        image: minio/mc
        depends_on:
            minio:
                condition: service_healthy
        networks: [chat-net]
        restart: 'no'
        entrypoint: >
            /bin/sh -c "
              mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}

              mc admin user add local ${MINIO_USER} ${MINIO_PASSWORD}

              mc admin policy attach local readwrite --user ${MINIO_USER}

              mc mb --ignore-existing local/primer-chat-pdf

              mc mb --ignore-existing local/primer-chat-chunks
              mc ilm rule add local/primer-chat-chunks --expiry-days 1
            "

    postgres:
        image: pgvector/pgvector:pg15
        ports:
            - '127.0.0.1:5432:5432'
        command:
            - 'postgres'
            - '-c'
            - 'max_connections=50'
            - '-c'
            - 'shared_buffers=1GB'
            - '-c'
            - 'effective_cache_size=4GB'
            - '-c'
            - 'work_mem=16MB'
            - '-c'
            - 'maintenance_work_mem=512MB'
            - '-c'
            - 'random_page_cost=1.1'
            - '-c'
            - 'temp_file_limit=10GB'
            - '-c'
            - 'log_min_duration_statement=200ms'
            - '-c'
            - 'idle_in_transaction_session_timeout=10s'
            - '-c'
            - 'lock_timeout=1s'
            - '-c'
            - 'statement_timeout=60s'
            - '-c'
            - 'shared_preload_libraries=pg_stat_statements'
            - '-c'
            - 'pg_stat_statements.max=10000'
            - '-c'
            - 'pg_stat_statements.track=all'
        environment:
            POSTGRES_DB: ${POSTGRES_DB?required}
            POSTGRES_USER: ${POSTGRES_USER?required}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?required}
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - ./initdb:/docker-entrypoint-initdb.d:ro
            - postgres-data:/var/lib/postgresql/data
        restart: unless-stopped
        networks: [chat-net]
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    minio-data:
    postgres-data:

networks:
    chat-net:
        name: chat-net
