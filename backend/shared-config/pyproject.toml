[project]
name = "shared-config"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml",
    "loguru"
]

[tool.setuptools.packages.find]
include = ["shared_config*"]

[tool.setuptools.package-data]
shared_config = ["config.*.yaml"]
