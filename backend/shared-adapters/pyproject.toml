[project]
name = "shared-adapters"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.0.0",
    "aiohttp>=3.12.14",
    "asyncio-throttle>=1.0.2",
    "openai>=1.97.1",
    "redis>=6.2.0",
    "shared-config",
    "shared-models",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
packages = ["shared_adapters"]

[tool.uv.sources]
shared-config = { path = "../shared-config" }
shared-models = { path = "../shared-models" }
