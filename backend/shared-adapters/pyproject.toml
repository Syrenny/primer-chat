[project]
name = "shared-adapters"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.0.0",
    "aiohttp>=3.12.14",
    "openai>=1.97.1",
    "shared-config",
    "shared-models",
]

[tool.setuptools]
packages = ["shared_adapters"]
package-dir = { "" = "src" }

[tool.uv.sources]
shared-config = { path = "../shared-config", editable = true }
shared-models = { path = "../shared-models", editable = true }
