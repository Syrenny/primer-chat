cookie_name: primer-chat-cookie
cookie_max_age: 31536000 # 1 год

max_files_per_user: 10

cors_allow_origins:
    - 'http://localhost:3000'
    - 'http://127.0.0.1:3000'

uvicorn:
    host: '0.0.0.0'
    port: 8000
    workers: 1
    reload: false

generation:
    listen_timeout_seconds: 30
    listen_max_attempts: 10
    max_len_history: 10

retriever:
    limit: 10
