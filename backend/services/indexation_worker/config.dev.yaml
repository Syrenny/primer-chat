openai_model: 'gpt-4o-mini-2024-07-18'
openai_base_url: https://api.openai.com/v1
openai_temperature: 0.0
openai_max_tokens: 8096
openai_throttle_rate_limit: 5
openai_throttle_period: 1.0

pages_batch_size: 3

embeddings_model: 'text-embedding-3-small'
embeddings_base_url: https://api.openai.com/v1
embeddings_dimensions: 1536
embeddings_throttle_rate_limit: 10
embeddings_throttle_period: 1.0
embeddings_batch_size: 10

max_concurrent_segments: 3

# kafka
kafka_bootstrap_servers: kafka:9092
kafka_topic_name: indexation
kafka_group_id: indexation-group
