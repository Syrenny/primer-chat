name: Primer Chat

on:
    push:
        branches: ['master']
    pull_request:
        branches: ['master']

jobs:
    build:
        runs-on: self-hosted

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Stop previous containers
              run: make down

            - name: Build and run containers
              run: |
                  echo "OPENAI_KEY=${{ secrets.OPENAI_KEY }}" >> ./docker/.env
                  echo "EMBEDDINGS_KEY=${{ secrets.EMBEDDINGS_KEY }}" >> ./docker/.env
                  echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> ./docker/.env
                  echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> ./docker/.env
                  echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> ./docker/.env
                  echo "MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}" >> ./docker/.env
                  echo "MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}" >> ./docker/.env
                  echo "MINIO_USER=${{ secrets.MINIO_USER }}" >> ./docker/.env
                  echo "MINIO_PASSWORD=${{ secrets.MINIO_PASSWORD }}" >> ./docker/.env
                  make up
